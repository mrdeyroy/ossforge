[project]
name = "ossforge"
version = "0.1.0"
description = "Scout, vet, and prepare quality open-source contributions (fix + feature) with a daily cap."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ossforge = "ossforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ossforge"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E501", "B905"]
